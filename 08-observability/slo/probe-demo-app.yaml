# Synthetic availability probe for demo-app (the workload in 05-gitops/manifests/slo-demo,
# namespace slo-demo). Needs the blackbox exporter (05-gitops/apps/blackbox-exporter.yaml)
# and the Prometheus selectors relaxed in 08-observability/install/kube-prometheus-stack-values.yaml.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: demo-app-http
  namespace: monitoring
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - http://demo-app.slo-demo.svc.cluster.local/
      labels:
        service: demo-app
