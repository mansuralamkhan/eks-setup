# Synthetic availability probe for demo-app. Needs the blackbox exporter
# (05-gitops/apps/blackbox-exporter.yaml) and the Prometheus selectors relaxed in
# 08-observability/install/kube-prometheus-stack-values.yaml.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: demo-app-http
  namespace: monitoring
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - http://demo-app.default.svc.cluster.local/
      labels:
        service: demo-app
