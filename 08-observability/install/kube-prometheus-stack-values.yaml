# Values for kube-prometheus-stack. Argo CD installs it via
# 05-gitops/apps/kube-prometheus-stack.yaml (namespace: monitoring).

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  # Admin credentials come from a Secret you create once, never from git:
  #   kubectl -n monitoring create secret generic grafana-admin \
  #     --from-literal=admin-user=admin --from-literal=admin-password='<choose one>'
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Picks up ConfigMaps labelled grafana_dashboard: "1" (see 08-observability/dashboards)
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

prometheus:
  prometheusSpec:
    retention: 15d
    # Select ServiceMonitors, PodMonitors, Probes and PrometheusRules from every
    # namespace, not only the ones carrying this Helm release's label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
