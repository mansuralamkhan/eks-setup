# EKS add-on: amazon-cloudwatch-observability
# Installed via:
# aws eks create-addon \
#   --cluster-name my-eks-cluster \
#   --addon-name amazon-cloudwatch-observability \
#   --service-account-role-arn arn:aws:iam::<ACCOUNT_ID>:role/<cloudwatch-observability-irsa-role>

addonName: amazon-cloudwatch-observability
clusterName: my-eks-cluster
resolveConflicts: OVERWRITE
serviceAccountRoleArn: "arn:aws:iam::<ACCOUNT_ID>:role/<cloudwatch-observability-irsa-role>"

# Deploys:
# - cloudwatch-agent DaemonSet (metrics)
# - fluent-bit DaemonSet (logs)