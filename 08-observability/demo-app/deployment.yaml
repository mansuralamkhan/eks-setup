apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: nginx:1.25.3
          ports:
            - containerPort: 80
          # /healthy returns 200, /error returns 500 — used to generate
          # controllable traffic for the ALB 5xx panel on the dashboard
          readinessProbe:
            httpGet:
              path: /healthy
              port: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"