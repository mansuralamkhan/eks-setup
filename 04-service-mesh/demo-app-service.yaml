apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: istio-lab
  labels:
    app: demo-app
spec:
  selector:
    app: demo-app
  ports:
    - name: http          # named port so Istio treats the traffic as HTTP
      port: 80
      targetPort: 5678    # hashicorp/http-echo listens on 5678
