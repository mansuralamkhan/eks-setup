apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-db-credentials
  namespace: default
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: app-db-credentials
  data:
    - secretKey: password
      remoteRef:
        key: eso-lab/db-credentials
        property: password