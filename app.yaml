apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: istio-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args:
            - "-text=Hello from the application"
          ports:
            - containerPort: 5678

---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: istio-lab
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      name: http
      targetPort: 5678
