# Probe, SLO rules, workload alerts and the Grafana dashboard (all need the
# Prometheus Operator CRDs from kube-prometheus-stack).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://github.com/mansuralamkhan/eks-setup.git
      targetRevision: main
      path: 08-observability/slo
    - repoURL: https://github.com/mansuralamkhan/eks-setup.git
      targetRevision: main
      path: 08-observability/alerts
    - repoURL: https://github.com/mansuralamkhan/eks-setup.git
      targetRevision: main
      path: 08-observability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
