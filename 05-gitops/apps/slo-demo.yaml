apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slo-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/mansuralamkhan/eks-setup.git
    targetRevision: main
    path: 05-gitops/manifests/slo-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: slo-demo
  # Lets you run the SLO fire drill (`kubectl scale ... --replicas=0`) without Argo CD
  # immediately putting the replicas back.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: demo-app
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
