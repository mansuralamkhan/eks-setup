apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after Kyverno and its CRDs are up
spec:
  project: default
  source:
    repoURL: https://github.com/mansuralamkhan/eks-setup.git
    targetRevision: main
    path: 07-policy/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
