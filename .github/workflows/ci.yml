name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive 01-foundation
      - name: validate
        working-directory: 01-foundation
        run: |
          terraform init -backend=false -input=false
          terraform validate

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: validate manifests (core + CRDs from the Datree catalog)
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-filename-pattern '.*\.json$' \
            -ignore-filename-pattern '.*/values/.*' \
            02-autoscaling 04-service-mesh 05-gitops 06-secrets 07-policy \
            08-observability/demo-app 08-observability/slo 08-observability/alerts 08-observability/dashboards

  kyverno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kyverno CLI
        run: |
          curl -sSL https://github.com/kyverno/kyverno/releases/download/v1.13.4/kyverno-cli_v1.13.4_linux_x86_64.tar.gz | tar xz kyverno
          sudo mv kyverno /usr/local/bin/
      - name: policy tests
        run: ./07-policy/run-tests.sh

  prometheus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install promtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            | tar xz --strip-components=1 prometheus-3.5.0.linux-amd64/promtool
          sudo mv promtool /usr/local/bin/
      - run: pip install pyyaml
      - name: lint and unit-test alert rules, check dashboard queries
        run: ./scripts/test-prometheus-rules.sh

  placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no unresolved placeholders in GitOps config
        run: |
          if grep -rnE 'PIN_LATEST|REPLACE_VELERO_BUCKET' 05-gitops; then
            echo "Run 'make pin' and 'make velero-bucket', then commit the result."; exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
